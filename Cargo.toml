[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
default-members = ["apps/alpha-harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/HarcicYang/alpha-harness"

[workspace.dependencies]
alpha-kernel = { path = "crates/alpha-kernel", version = "0.1.0" }
alpha-credential-api = { path = "crates/alpha-credential-api", version = "0.1.0" }
alpha-host-api = { path = "crates/alpha-host-api", version = "0.1.0" }
alpha-http-api = { path = "crates/alpha-http-api", version = "0.1.0" }
alpha-schema = { path = "crates/alpha-schema", version = "0.1.0" }
alpha-permission-api = { path = "crates/alpha-permission-api", version = "0.1.0" }
alpha-prompt-api = { path = "crates/alpha-prompt-api", version = "0.1.0" }
alpha-protocol = { path = "crates/alpha-protocol", version = "0.1.0" }
alpha-macros = { path = "crates/alpha-macros", version = "0.1.0" }
alpha-agent-api = { path = "crates/alpha-agent-api", version = "0.1.0" }
alpha-core = { path = "crates/alpha-core", version = "0.1.0" }
alpha-build = { path = "crates/alpha-build", version = "0.1.0" }
alpha-module-config = { path = "crates/alpha-module-config", version = "0.1.0" }
alpha-module-credential = { path = "crates/alpha-module-credential", version = "0.1.0" }
alpha-module-compaction = { path = "crates/alpha-module-compaction", version = "0.1.0" }
alpha-session-log = { path = "crates/alpha-session-log", version = "0.1.0" }
alpha-module-agent-host = { path = "crates/alpha-module-agent-host", version = "0.1.0" }
alpha-module-loop = { path = "crates/alpha-module-loop", version = "0.1.0" }
alpha-module-fs = { path = "crates/alpha-module-fs", version = "0.1.0" }
alpha-module-process = { path = "crates/alpha-module-process", version = "0.1.0" }
alpha-module-http = { path = "crates/alpha-module-http", version = "0.1.0" }
alpha-module-permission = { path = "crates/alpha-module-permission", version = "0.1.0" }
alpha-module-prompt = { path = "crates/alpha-module-prompt", version = "0.1.0" }
alpha-module-tools = { path = "crates/alpha-module-tools", version = "0.1.0" }
alpha-module-provider-openai = { path = "crates/alpha-module-provider-openai", version = "0.1.0" }
alpha-front-client = { path = "crates/alpha-front-client", version = "0.1.0" }
alpha-front-runtime = { path = "crates/alpha-front-runtime", version = "0.1.0" }
alpha-front-supervisor = { path = "crates/alpha-front-supervisor", version = "0.1.0" }
alpha-front-desktop = { path = "crates/alpha-front-desktop", version = "0.1.0" }
alpha-front-tui = { path = "crates/alpha-front-tui", version = "0.1.0" }
alpha-provider-api = { path = "crates/alpha-provider-api", version = "0.1.0" }
alpha-api-openai-chat = { path = "crates/alpha-api-openai-chat", version = "0.1.0" }
alpha-api-openai-responses = { path = "crates/alpha-api-openai-responses", version = "0.1.0" }
alpha-api-anthropic-messages = { path = "crates/alpha-api-anthropic-messages", version = "0.1.0" }
alpha-module-provider-openai-chat-completions = { path = "crates/alpha-module-provider-openai-chat-completions", version = "0.1.0" }
alpha-module-provider-openai-responses = { path = "crates/alpha-module-provider-openai-responses", version = "0.1.0" }
alpha-module-provider-anthropic-messages = { path = "crates/alpha-module-provider-anthropic-messages", version = "0.1.0" }
alpha-module-provider-deepseek = { path = "crates/alpha-module-provider-deepseek", version = "0.1.0" }
alpha-module-provider-opencode-go = { path = "crates/alpha-module-provider-opencode-go", version = "0.1.0" }
alpha-module-provider-config = { path = "crates/alpha-module-provider-config", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.18"
base64 = "0.22"
futures = "0.3"
fs2 = "0.4"
regex = "1"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", default-features = false, features = ["process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
ureq = "2"
uuid = { version = "1", features = ["serde", "v7"] }
unicode-width = "0.2"
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["osc52"] }
pulldown-cmark = { version = "0.13", default-features = false }
gpui-kit = { version = "0.7.3", features = ["gpui-fast"] }
