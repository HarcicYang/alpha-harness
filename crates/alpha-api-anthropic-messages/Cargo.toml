[package]
name = "alpha-api-anthropic-messages"
description = "Anthropic Messages API adapter for alpha-harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "anthropic", "messages", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-kernel.workspace = true
alpha-module-http.workspace = true
alpha-module-loop.workspace = true
alpha-provider-api.workspace = true
alpha-schema.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.alpha]
api = 1
kind = "module"
key = "api.anthropic-messages"
requires = ["api.adapter"]
registry_entries = ["api:anthropic-messages"]
