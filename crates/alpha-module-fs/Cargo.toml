[package]
name = "alpha-module-fs"
description = "Filesystem seam and local driver module for alpha-harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "filesystem", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-kernel.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.alpha]
api = 1
kind = "module"
scope = "location"
module = "FsLocalModule"
config = "FsConfig"
requires_config = ["root"]
key = "fs.local"
provides = [{ key = "fs", kind = "singleton", scope = "location" }]
