[package]
name = "alpha-module-compaction"
description = "Budget-based context compaction for alpha-harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "context", "compaction", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-kernel.workspace = true
alpha-module-loop.workspace = true
alpha-session-log.workspace = true
alpha-schema.workspace = true
futures.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.alpha]
api = 1
kind = "module"
scope = "location"
module = "CompactionModule"
config = "CompactionConfig"
requires_config = []
key = "compaction"
provides = [
    { key = "context.compaction", kind = "singleton", scope = "location" },
    { key = "context.token_estimator", kind = "singleton", scope = "location" },
]
