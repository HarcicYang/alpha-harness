[package]
name = "alpha-module-provider-openai-chat-completions"
description = "Generic OpenAI Chat Completions provider for alpha-harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "openai", "provider", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-kernel.workspace = true
alpha-module-loop.workspace = true
alpha-provider-api.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
alpha-api-openai-chat.workspace = true
alpha-module-http.workspace = true
futures.workspace = true

[package.metadata.alpha]
api = 1
kind = "module"
scope = "global"
module = "OpenAiChatProviderModule"
config = "()"
requires_config = []
key = "provider.openai-chat-completions"
provides = [{ key = "provider.kind", kind = "registry", scope = "global" }]
requires = ["api.adapter"]
registry_entries = ["provider:openai-chat-completions"]
