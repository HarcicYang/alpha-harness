[package]
name = "alpha-module-http"
description = "Network seam and local HTTP driver module for alpha-harness, with record and replay support."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "http", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-kernel.workspace = true
futures.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
ureq.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }

[package.metadata.alpha]
api = 1
kind = "module"
key = "http.local"
provides = [{ key = "http", kind = "singleton", scope = "location" }]
