[package]
name = "alpha-front-runtime"
description = "UI-independent runtime shared by alpha frontends."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "frontend", "runtime"]
categories = ["development-tools"]

[dependencies]
alpha-front-client.workspace = true
alpha-front-supervisor.workspace = true
alpha-protocol.workspace = true
alpha-schema.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.alpha]
api = 1
kind = "front"
commands = [
    { name = "run", about = "Run one prompt and exit", entry = "__front_run", takes_prompt = true },
]
