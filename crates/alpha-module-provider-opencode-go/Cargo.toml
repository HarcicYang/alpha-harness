[package]
name = "alpha-module-provider-opencode-go"
description = "OpenCode Go provider for alpha-harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "opencode", "provider", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-kernel.workspace = true
alpha-module-loop.workspace = true
alpha-provider-api.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[package.metadata.alpha]
api = 1
kind = "module"
scope = "global"
module = "OpenCodeGoProviderModule"
config = "()"
requires_config = []
key = "provider.opencode-go"
provides = [{ key = "provider.kind", kind = "registry", scope = "global" }]
requires = ["api.adapter"]
registry_entries = ["provider:opencode-go"]
