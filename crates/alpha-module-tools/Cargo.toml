[package]
name = "alpha-module-tools"
description = "Built-in read, grep, write, edit, and shell tools for alpha-harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "tools", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-kernel.workspace = true
alpha-module-fs.workspace = true
alpha-module-permission.workspace = true
alpha-module-process.workspace = true
alpha-schema.workspace = true
futures.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros"] }
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.alpha]
api = 1
kind = "module"
scope = "agent"
module = "ToolsModule"
config = "ToolsConfig"
requires_config = []
key = "tools"
provides = [{ key = "tool", kind = "registry", scope = "location" }]
requires = ["fs", "process", "permission"]
registry_entries = ["read", "grep", "write", "edit", "shell"]
