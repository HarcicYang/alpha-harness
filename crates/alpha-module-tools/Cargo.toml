[package]
name = "alpha-module-tools"
description = "Built-in read, grep, write, edit, and shell tools for alpha-harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "tools", "alpha-module"]
categories = ["development-tools"]

[dependencies]

[package.metadata.alpha]
api = 1
kind = "module"
key = "tools"
provides = [{ key = "tool", kind = "registry", scope = "location" }]
requires = ["fs", "process"]
registry_entries = ["read", "grep", "write", "edit", "shell"]
