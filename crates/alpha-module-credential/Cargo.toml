[package]
name = "alpha-module-credential"
description = "Cross-platform credential storage for alpha-harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "credential", "keyring", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-kernel.workspace = true
alpha-schema.workspace = true
keyring-core = "1.0.0"
serde.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[dev-dependencies]
serde_json.workspace = true

[package.metadata.alpha]
api = 1
kind = "module"
scope = "global"
module = "CredentialModule"
config = "CredentialConfig"
requires_config = []
key = "credential"
provides = [{ key = "credential.store", kind = "singleton", scope = "global" }]
