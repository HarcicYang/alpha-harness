[package]
name = "alpha-module-provider-openai"
description = "OpenAI-compatible model provider module for alpha-harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "llm", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-kernel.workspace = true
alpha-module-http.workspace = true
alpha-module-loop.workspace = true
alpha-schema.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.alpha]
api = 1
kind = "module"
key = "provider.openai"
requires = ["model.provider"]
registry_entries = ["openai-compatible"]
