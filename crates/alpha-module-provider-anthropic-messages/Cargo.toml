[package]
name = "alpha-module-provider-anthropic-messages"
description = "Generic Anthropic Messages provider for alpha-harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "anthropic", "provider", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-kernel.workspace = true
alpha-module-loop.workspace = true
alpha-provider-api.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[package.metadata.alpha]
api = 1
kind = "module"
scope = "global"
module = "AnthropicMessagesProviderModule"
config = "()"
requires_config = []
key = "provider.anthropic-messages"
provides = [{ key = "provider.kind", kind = "registry", scope = "global" }]
requires = ["api.adapter"]
registry_entries = ["provider:anthropic-messages"]
