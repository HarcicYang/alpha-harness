[package]
name = "alpha-module-process"
description = "Process execution seam and local driver module for alpha-harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "process", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-kernel.workspace = true
futures.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[package.metadata.alpha]
api = 1
kind = "module"
scope = "location"
module = "ProcessLocalModule"
config = "ProcessConfig"
requires_config = ["cwd"]
key = "process.local"
provides = [{ key = "process", kind = "singleton", scope = "location" }]
