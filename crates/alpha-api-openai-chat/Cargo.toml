[package]
name = "alpha-api-openai-chat"
description = "OpenAI Chat Completions API adapter for alpha-harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "openai", "adapter", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-kernel.workspace = true
alpha-http-api.workspace = true
alpha-module-loop.workspace = true
alpha-provider-api.workspace = true
alpha-schema.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.alpha]
api = 1
kind = "module"
scope = "global"
module = "OpenAiChatApiModule"
config = "()"
requires_config = []
key = "api.openai-chat"
requires = ["api.adapter"]
registry_entries = ["api:openai-chat-completions"]
