[package]
name = "alpha-module-prompt"
description = "Composable system-prompt assembly for alpha-harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "prompt", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-kernel.workspace = true
alpha-module-fs.workspace = true
alpha-module-loop.workspace = true
alpha-module-permission.workspace = true
alpha-session-log.workspace = true
alpha-schema.workspace = true
futures.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.alpha]
api = 1
kind = "module"
key = "prompt"
provides = [
    { key = "prompt.assembler", kind = "singleton", scope = "location" },
    { key = "prompt.section", kind = "registry", scope = "location" },
    { key = "prompt.context", kind = "registry", scope = "location" },
    { key = "context.injector", kind = "singleton", scope = "location" },
]
requires = ["fs"]
