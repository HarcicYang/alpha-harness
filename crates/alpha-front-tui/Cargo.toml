[package]
name = "alpha-front-tui"
description = "Full-screen terminal frontend for alpha-harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "tui", "frontend"]
categories = ["development-tools"]

[dependencies]
alpha-front-runtime.workspace = true
alpha-schema.workspace = true
crossterm.workspace = true
pulldown-cmark.workspace = true
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
serde_json.workspace = true
thiserror.workspace = true
unicode-width.workspace = true

[package.metadata.alpha]
api = 1
kind = "front"
commands = [
    { name = "chat", about = "Chat without switching to the alternate screen", entry = "__front_chat", takes_prompt = false },
    { name = "tui", about = "Open the full-screen terminal interface", entry = "__front_tui", takes_prompt = false },
]
