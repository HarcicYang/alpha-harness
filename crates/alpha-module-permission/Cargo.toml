[package]
name = "alpha-module-permission"
description = "Permission modes, approvals, policy evaluation, and sandbox integration for alpha-harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "permissions", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-kernel.workspace = true
alpha-schema.workspace = true
futures.workspace = true
serde.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.alpha]
api = 1
kind = "module"
scope = "agent"
module = "PermissionModule"
config = "PermissionConfig"
requires_config = []
key = "permission"
provides = [{ key = "permission", kind = "singleton", scope = "location" }]
