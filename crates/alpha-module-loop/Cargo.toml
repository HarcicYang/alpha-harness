[package]
name = "alpha-module-loop"
description = "Default agent driver module for alpha-harness, replaceable like any module."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "agent-loop", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-kernel.workspace = true
alpha-module-session.workspace = true
alpha-schema.workspace = true
futures.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.alpha]
api = 1
kind = "module"
key = "loop"
provides = [
    { key = "agent.loop", kind = "singleton", scope = "agent" },
    { key = "model.provider", kind = "registry", scope = "global" },
]
