[package]
name = "alpha-module-loop"
description = "Default agent driver module for alpha-harness, replaceable like any module."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["alpha-harness", "agent-loop", "alpha-module"]
categories = ["development-tools"]

[dependencies]
alpha-agent-api.workspace = true
alpha-kernel.workspace = true
alpha-session-log.workspace = true
alpha-module-tools.workspace = true
alpha-schema.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.alpha]
api = 1
kind = "module"
scope = "agent"
module = "LoopModule"
config = "LoopConfig"
requires_config = ["provider", "model"]
key = "loop"
provides = [
    { key = "agent.loop", kind = "singleton", scope = "agent" },
    { key = "model.provider", kind = "registry", scope = "global" },
]
